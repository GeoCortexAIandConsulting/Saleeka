# Render Blueprint: deploys the Express API and the Next.js web app as two web services.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are asked for
# when the Blueprint is created; secrets are never stored in this file.
services:
  # Express API (server/)
  - type: web
    name: saleeqa-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev: TypeScript is a dev dependency and is needed for the build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Full Atlas string with the real password, e.g.
      # mongodb+srv://<user>:<password>@<cluster>/
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: saleeqa
      # Public URL of the web service below (check it in the dashboard once created).
      - key: WEB_ORIGIN
        value: https://saleeqa-web.onrender.com
      - key: LLM_PROVIDER
        value: rules
      # AI look preview: a Google Cloud API key restricted to the Vertex AI API (leave empty to hide it).
      - key: GOOGLE_API_KEY
        sync: false
      # Most new AI previews across all players per day (a cap on what one busy night can cost).
      - key: PREVIEW_GLOBAL_DAILY_CAP
        value: "300"
      # Emergency switch: set to true to stop new AI previews for everyone (publishing still works).
      - key: PREVIEWS_OFF
        value: "false"
      # New players sign in straight away; set to "on" to ask them to confirm their email first.
      - key: EMAIL_CONFIRMATION
        value: "off"
      # The admin portal's sign-in (/admin); set both in the Render dashboard (password: 12+ characters).
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Account emails: resend or brevo, its API key, and a sender address it has verified.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Next.js web app (web/)
  - type: web
    name: saleeqa-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of the API service above. Read at build time, so redeploy the web app if it changes.
      - key: API_URL
        value: https://saleeqa-api.onrender.com
